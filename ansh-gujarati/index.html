    <!--
      Facebook Pixel
      Pixel ID, नंबर आदि बदलने के लिए प्रोजेक्ट की जड़ में मौजूद .env फ़ाइल बदलें।
      VITE_FB_PIXEL_ID खाली रहने पर Pixel लोड नहीं होगा और साइट सामान्य रूप से चलेगी।
    -->
    <script>
      (function () {
        var pixelId = '%VITE_FB_PIXEL_ID%';
        if (!pixelId || pixelId.indexOf('%') !== -1) {
          return;
        }
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = '2.0';
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', pixelId);
        window.fbq('track', 'PageView');
      })();
    </script>
