<!doctype html>
<html lang="gu" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <style>
      /* Google Translate ka top banner / tooltip kisi bhi haal me na dikhe. */
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      body {
        top: 0 !important;
      }
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123D22" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Ansh Ayurveda — તમારો ઓર્ડર સફળતાપૂર્વક નોંધાઈ ગયો છે. અમારી ટીમ જલદી તમારો સંપર્ક કરશે." />
    <title>આભાર! | Ansh Ayurveda</title>

    <!--
      Facebook Pixel — index.html की तरह ही यहाँ भी .env की VITE_FB_PIXEL_ID का उपयोग होता है।
      Pixel ID खाली रहने पर Pixel लोड नहीं होगा और पेज सामान्य रूप से चलेगा।
    -->
    <script>
      (function () {
        var pixelId = '%VITE_FB_PIXEL_ID%';
        if (!pixelId || pixelId.indexOf('%') !== -1) {
          return;
        }
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = '2.0';
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', pixelId);
        window.fbq('track', 'PageView');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --forest: #123d22;
        --deep: #082b18;
        --gold: #c6a34a;
        --gold-dark: #a8873a;
        --gold-soft: #efe4c8;
        --cream: #fff9eb;
        --text: #242824;
        --muted: #5e665e;
        --line: #e8e4d6;
        --font-body: 'Noto Sans Devanagari', 'Poppins', system-ui, -apple-system, sans-serif;
        --font-latin: 'Poppins', 'Noto Sans Devanagari', sans-serif;
        --shadow-lg: 0 24px 60px rgba(8, 43, 24, 0.16);
        --radius-md: 18px;
        --radius-lg: 26px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(160deg, #061f12 0%, #123d22 55%, #1c5233 100%);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .thankyou {
        width: 100%;
        max-width: 620px;
      }

      .thankyou__card {
        position: relative;
        overflow: hidden;
        padding: clamp(28px, 5vw, 48px);
        border: 1px solid rgba(198, 163, 74, 0.3);
        border-radius: var(--radius-lg);
        background: #ffffff;
        box-shadow: var(--shadow-lg);
        text-align: center;
      }

      .thankyou__card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--gold) 0%, var(--forest) 100%);
      }

      .thankyou__icon {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--forest) 0%, #1c5233 100%);
        color: #ffffff;
        font-size: 2.4rem;
        line-height: 1;
        box-shadow: 0 14px 30px rgba(18, 61, 34, 0.3);
        animation: pop 0.5s ease-out both;
      }

      .thankyou__eyebrow {
        display: inline-block;
        margin: 0 0 6px;
        padding: 6px 14px;
        border: 1px solid rgba(198, 163, 74, 0.5);
        border-radius: 999px;
        background: var(--cream);
        color: var(--gold-dark);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .thankyou__title {
        margin: 0;
        color: var(--deep);
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 800;
      }

      .thankyou__text {
        margin: 14px 0 0;
        color: var(--text);
        font-size: 1.02rem;
      }

      .thankyou__text strong {
        color: var(--forest);
      }

      .thankyou__sub {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .thankyou__actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 26px 0 18px;
      }

      .thankyou__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 15px 18px;
        border-radius: 999px;
        color: #ffffff;
        font-weight: 700;
        font-size: 0.95rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .thankyou__btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(8, 43, 24, 0.22);
        filter: brightness(1.05);
      }

      .thankyou__btn svg {
        font-size: 1.1rem;
      }

      .thankyou__btn--call {
        background: linear-gradient(135deg, #1c5233 0%, #123d22 100%);
      }

      .thankyou__btn--wa {
        background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      }

      .thankyou__note {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .thankyou__home {
        display: inline-block;
        color: var(--forest);
        font-weight: 600;
        font-size: 0.9rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: 2px;
      }

      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        .thankyou__actions {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .thankyou__icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="thankyou">
      <div class="thankyou__card">
        <span class="thankyou__icon" aria-hidden="true">&#10004;</span>
        <p class="thankyou__eyebrow">ઓર્ડર સફળ</p>
        <h1 class="thankyou__title">આભાર!</h1>
        <p class="thankyou__text">
          તમારી માહિતી સફળતાપૂર્વક નોંધાઈ ગઈ છે.
          <strong>અમારી ટીમ જલદી તમારો સંપર્ક કરશે.</strong>
        </p>
        <p class="thankyou__sub">
          કૃપા કરીને તમારો ફોન પાસે રાખો — અમારી ટીમ કૉલ કે WhatsApp દ્વારા તમારો સંપર્ક કરશે.
        </p>

        <div class="thankyou__actions">
          <a id="callBtn" href="tel:%VITE_PHONE_NUMBER%" class="thankyou__btn thankyou__btn--call">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            કૉલ કરો
          </a>
          <a id="waBtn" href="#" class="thankyou__btn thankyou__btn--wa">
            <svg width="18" height="18" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
              <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.4-5-3.8-10.5-6.6z" />
            </svg>
            WhatsApp પર વાત કરો
          </a>
        </div>

        <p class="thankyou__note">
          ફોર્મ ફરી ભરવાની જરૂર નથી — અમારી ટીમ પોતે તમારો સંપર્ક કરશે.
        </p>

        <a href="/ansh-gujarati/" class="thankyou__home">&larr; હોમ પેજ પર પાછા જાઓ</a>
      </div>
    </main>

    <script>
      (function () {
        // .env से नंबर लें; मान न मिले तो सुरक्षित fallback उपयोग करें।
        function envValue(value, fallback) {
          return !value || value.indexOf('%') !== -1 ? fallback : value;
        }

        function trackLead(method) {
          if (typeof window.fbq === 'function') {
            window.fbq('track', 'Contact', { method: method });
            window.fbq('track', 'Lead', { method: method });
          }
        }

        // धन्यवाद पेज पर पहुँचते ही यह Lead के रूप में गिना जाए।
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Lead', {
            content_name: 'Order Form',
            content_category: 'Ansh Ayurveda',
          });
        }

        var phone = envValue('%VITE_PHONE_NUMBER%', '+91 70413 05592');
        var whatsapp = envValue('%VITE_WHATSAPP_NUMBER%', '+917041305592');

        var callBtn = document.getElementById('callBtn');
        var waBtn = document.getElementById('waBtn');

        callBtn.href = 'tel:' + phone.replace(/[^\d+]/g, '');
        waBtn.href =
          'https://wa.me/' +
          whatsapp.replace(/\D/g, '') +
          '?text=' +
          encodeURIComponent('નમસ્તે અન્શ આયુર્વેદ, મેં ઓર્ડર ફોર્મ ભર્યું છે. મને માહિતી જોઈએ છે.');

        // कॉल / WhatsApp क्लिक भी Lead के रूप में गिना जाए।
        callBtn.addEventListener('click', function () {
          trackLead('phone');
        });
        waBtn.addEventListener('click', function () {
          trackLead('whatsapp');
        });
      })();
    </script>
  </body>
</html>
